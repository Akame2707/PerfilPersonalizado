<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../Assets/css/style.css">
    <title>Formulario</title>
</head>

<body>
    <img src="../Assets/img/7e2711d37b6242f5f351cc0542aa6913.jpg" height="200px">
    <header>
        <h1>Perfil Personalizado</h1>
    </header>

    <form id="formulario" action="perfilpersonalizado.html">
        <label for="nome">Nome:</label>
        <input type="text" id="nome" placeholder="informe seu nome">

        <br><br>

        <label for="Idade">Idade:</label>
        <input type="number" id="idade" placeholder="informe a sua idade">

        <br><br>
        <label for="bio">Crie uma bio para você:</label>
        <br>
        <textarea cols="25" rows="4" id="bio" placeholder="Digite uma mensagem bonita!"></textarea>

        <br><br>

        <label for="corfavorita">Sua cor favorita:</label>
        <input type="color" name="color" id="cor" />

        <br><br>

        <label>Imagem:</label>
        <input type="text" id="imagem" placeholder="Cole a URL da imagem">


        <br><br>

        <label>Jogo </label>
        <input type="text" id="jogo" placeholder="Insira seu jogo favorito">
        <br><br>
        <label>Música </label>
        <input type="text" id="musica" placeholder="Insira sua música">
        <br><br>
        <label>Filme </label>
        <input type="text" id="filme" placeholder="Insira seu filme favorito">
        <br><br>
        <label>Interesse</label>
        <input type="text" id="interesse" placeholder="Insira o seu interesse">
        <br><br>

        <button type="submit">Verificar</button>
    </form>

    <footer>
        <p>2026 Akame | Formulário Personalizado</p>
    </footer>
    <script src="../Assets/js/script.js"></script>
</body>

</html>
